networks:
  chatflow_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  redpanda_data:
  minio_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: chatflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatflow_secret}
      POSTGRES_DB: ${POSTGRES_DB:-chatflow}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chatflow_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-chatflow} -d ${POSTGRES_DB:-chatflow}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: chatflow_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chatflow_net
    healthcheck:
      test:
        ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  redpanda:
    image: redpandadata/redpanda:v23.3.11
    container_name: chatflow_redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "19092:19092" # external Kafka API
      - "18082:18082" # external HTTP proxy
      - "18081:18081" # external schema registry
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - chatflow_net
    healthcheck:
      test:
        ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
  redpanda_console:
    image: redpandadata/console:v2.4.5
    container_name: chatflow_redpanda_console
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
    volumes:
      - type: bind
        source: ./infra/redpanda-console-config.yml
        target: /tmp/config.yml
        read_only: true
    ports:
      - "8090:8080"
    networks:
      - chatflow_net
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: chatflow_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console at http://localhost:9001
    volumes:
      - minio_data:/data
    networks:
      - chatflow_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatflow_backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-chatflow}:${POSTGRES_PASSWORD:-chatflow_secret}@postgres:5433/${POSTGRES_DB:-chatflow}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      KAFKA_BROKERS: redpanda:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_secret}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - chatflow_net
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chatflow_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
    ports:
      - "3000:3000"
    networks:
      - chatflow_net
